[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assay"
version = "0.1.0"
description = "Adversarial code review with witnesses"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# repo root only: tests import harness.* and tools.* as packages, they do not guess directories
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]
