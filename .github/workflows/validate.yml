name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # First, and standard library only. Everything below runs repository code by path, and
      # requirements-dev.txt is itself covered by the lock, so installing before verifying would
      # execute a manifest the check has not yet agreed to.
      - name: Verify repository integrity against the external anchor
        env:
          ASSAY_ANCHOR: ${{ vars.ASSAY_SET_DIGEST }}
          ASSAY_VERIFIER_DIGEST: ${{ vars.ASSAY_VERIFIER_DIGEST }}
        run: |
          python tools/integrity.py verify \
            ${ASSAY_ANCHOR:+--anchor "$ASSAY_ANCHOR"} \
            ${ASSAY_VERIFIER_DIGEST:+--verifier-digest "$ASSAY_VERIFIER_DIGEST"}

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint the harness
        run: python -m pyflakes harness tools tests

      - name: Validate corpus (schema, provenance, licensing guard)
        run: python tools/validate_corpus.py

      - name: Review our own code with the catalogue's rules
        run: python tools/self_review.py

      - name: Tests
        run: pytest -q

      - name: Attack the security invariant
        run: python tools/hostile_matrix.py

      - name: failure intelligence is internally consistent
        run: python tools/failure_intelligence.py --check

      - name: behavioural witness runs its own scenarios
        run: python tools/behavioral_witness.py

      - name: classifier scores against the labelled benchmark
        run: python tools/failure_classifier.py --eval

      - name: emit findings for code scanning
        if: always()
        run: python tools/failure_intelligence.py --sarif findings.sarif

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findings-sarif
          path: findings.sarif
