name: validate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate corpus (schema, provenance, licensing guard)
        run: python tools/validate_corpus.py
      - name: Review our own code with the catalogue's rules
        run: python tools/self_review.py
      - name: Tests
        run: pytest -q
